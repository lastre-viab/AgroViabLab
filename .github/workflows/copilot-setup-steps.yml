name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            libboost-dev \
            libspdlog-dev \
            ninja-build

      - name: Create required runtime directories
        run: mkdir -p LOG OUTPUT

      - name: Configure CMake
        run: cmake -S source -B source/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build source/build -j$(nproc)
